# Machine profiles.
#
# Each profile names the tools mise should pin and the stow packages to link.
# Differences between machines belong here, expressed as which packages get
# selected. They must never be expressed by keeping a second copy of the same
# config file, which is the thing this repository exists to prevent.
#
# Add a machine type by adding a profile, then run:
#   ./install.sh --profile <name>

# Reusable tool sets. A profile opts in by name, so a second Linux box reuses
# this list instead of restating it and a version bump stays a single edit.
#
# A tool listed here must not also come from another installer on that machine.
# Two copies means PATH order decides which one runs, and they drift silently.
[tool_sets.base]
tools = [
  "node@22.22.3",
  "bun@1.3.13",
  "pnpm@11.20.0",
  "go@1.26",
  "rust@1.97.1",
  "uv@0.11.7",
  "gh@2.98.0",
  "rg@14.1.1",
  "fd@10.3.0",
  "npm:@earendil-works/pi-coding-agent@0.84.4",
]

[profiles.macos]
description = "Laptop. Homebrew keeps casks and native libraries."
brewfile = "brew/Brewfile"
# Deliberately not using tool_sets.base. On this machine those tools come from
# Homebrew, fnm, rustup, and bun's own installer. Adopting the set would
# downgrade rg and fd, and take node from fnm and rust from rustup. That is a
# deliberate migration, not a side effect of running this script.
tool_sets = []
tools = ["terraform@1.5.7"]
packages = [
  "brew",
  "claude",
  "codex",
  "ghostty",
  "git",
  "herdr",
  "macos",
  "pi",
  "starship",
  "worktrunk",
  "zed",
]

[profiles.linux]
description = "Headless agent host. No Homebrew and no GUI applications."
tool_sets = ["base"]
# zig builds Herdr's vendored libghostty-vt from Charlie's fork.
tools = ["zig@0.15.2"]
packages = [
  "git",
  "herdr-linux",
  "pi",
]

# Deliberately in no profile:
#
#   superset, vscode  Stored for reference only. Their paths are not stow
#                     shaped, so linking them would create ~/settings.json
#                     and ~/themes/, which is not where either belongs.
#   zsh               The tracked copy has already drifted from the live
#                     ~/.zshrc, which is a real file rather than a link.
#                     Reconcile the two before adding it to a profile.
