[bootstrap.packages]
"apt:build-essential" = "latest"
"apt:ca-certificates" = "latest"
"apt:curl" = "latest"
"apt:git" = "latest"
"apt:jq" = "latest"
"apt:libicu-dev" = "latest"
"apt:libssl-dev" = "latest"
"apt:lsof" = "latest"
"apt:pkg-config" = "latest"
"apt:rsync" = "latest"
"apt:sqlite3" = "latest"
"apt:tmux" = "latest"
"apt:unzip" = "latest"
"apt:zip" = "latest"

[bootstrap.mise_shell_activate]
bash_profile = "shims"
bashrc = "activate"

[dotfiles]
"~/.bash_profile/local-bin" = { line = 'export PATH="$HOME/.local/bin:$PATH"', position = "prepend" }
"~/.bashrc/local-bin" = { line = 'export PATH="$HOME/.local/bin:$PATH"', position = "prepend" }
