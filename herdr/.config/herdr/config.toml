onboarding = false

[keys]
detach = ["prefix+q", "cmd+shift+q"]
new_workspace = ["prefix+shift+n", "cmd+n"]
close_workspace = ["prefix+shift+d", "cmd+shift+w"]
new_tab = ["prefix+c", "cmd+t"]
previous_tab = ["prefix+p", "cmd+shift+["]
next_tab = ["prefix+n", "cmd+shift+]"]
switch_tab = ["prefix+1..9", "cmd+1..9"]
close_tab = ["prefix+shift+x"]
split_vertical = ["prefix+v", "cmd+d"]
split_horizontal = ["prefix+minus", "cmd+shift+d"]
close_pane = ["prefix+x"]
focus_pane_left = ["prefix+h", "cmd+["]
focus_pane_right = ["prefix+l", "cmd+]"]
focus_pane_up = ["prefix+k", "cmd+alt+up"]
focus_pane_down = ["prefix+j", "cmd+alt+down"]
zoom = ["prefix+z", "cmd+shift+enter"]
last_pane = "cmd+l"
open_worktree = "cmd+alt+o"

[[keys.command]]
key = "cmd+w"
type = "shell"
command = "$HOME/.config/herdr/pane-history.mjs close"
description = "close pane and remember it"

[[keys.command]]
key = "cmd+shift+t"
type = "shell"
command = "$HOME/.config/herdr/pane-history.mjs reopen"
description = "reopen last closed pane"

[[keys.command]]
key = "cmd+shift+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer"
description = "open file viewer"

[[keys.command]]
key = "cmd+shift+o"
type = "shell"
command = "$HOME/.local/libexec/herdr-worktrunk-picker open"
description = "open or create a Worktrunk worktree"

[[keys.command]]
key = "cmd+shift+r"
type = "shell"
command = "$HOME/.local/libexec/herdr-worktrunk-picker remove"
description = "remove a Worktrunk worktree"

[[keys.command]]
key = "cmd+alt+r"
type = "plugin_action"
command = "local.rotate-split.rotate"
description = "rotate the current two-pane split"

[theme]
name = "tokyo-night"
auto_switch = false

[ui.toast]
delivery = "terminal"

[ui]
prompt_new_tab_name = false
show_agent_labels_on_pane_borders = true
pane_scrollbars = false
pane_gaps = true
status_indicators = "symbols"
agent_panel_sort = "spaces"

[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", "$pr", "state_text"],
]

[experimental]
kitty_graphics = true
